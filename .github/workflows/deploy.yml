name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check GitHub OIDC identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": (
                      "Bearer "
                      + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("Subject:", claims["sub"])
          print("Audience:", claims["aud"])
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::289971515064:role/github-portfolio-deploy
          aws-region: ap-southeast-2

      - name: Upload homepage
        run: |
          aws s3 cp portfolio.html \
            s3://joe-errington-portfolio/index.html \
            --content-type "text/html" \
            --cache-control "no-cache"

      - name: Upload videos
        run: |
          if [ -d videos ]; then
            aws s3 sync videos/ \
              s3://joe-errington-portfolio/videos/ \
              --cache-control "public,max-age=3600"
          fi
      - name: Upload images
        run: |
          aws s3 sync images/ \
            s3://joe-errington-portfolio/images/ \
            --cache-control "public,max-age=3600"
            
      - name: Refresh CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2V4NBGJFSYNK \
            --paths "/*"